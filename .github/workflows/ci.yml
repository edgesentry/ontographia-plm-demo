name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (verify SHAs against upstream release tags before merge)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      # WASM comes from @edgesentry/ontographia-wasm at install time; no cargo/rust.
      # `npm run verify` already typechecks and builds, so there is no separate tsc/build step.
      - run: npm ci
      - run: npm run verify
      # Browser smoke uses Playwright's Chromium; the runner has no system Chrome.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
  farmbot:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (verify SHAs against upstream release tags before merge)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:farmbot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farmbot-duckdb
          path: |
            farmbot/dist/farmbot.duckdb
            farmbot/dist/farmbot.duckdb.sha256
          retention-days: 90
  farmbot-smoke:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (verify SHAs against upstream release tags before merge)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The runner has no system Chrome; the smoke prefers Playwright's Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:farmbot
  farmbot-release-assets:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (verify SHAs against upstream release tags before merge)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:assets -- --out release-assets
      - run: npm run release:verify -- release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farmbot-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 90
